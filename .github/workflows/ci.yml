name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Test UI
        working-directory: apps/desktop
        run: pnpm test
      - name: Build UI
        working-directory: apps/desktop
        run: pnpm build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The transcription feature (whisper.cpp) is only shipped for macOS, so it
      # is only linted there. cmake is preinstalled on the runner image; the
      # guard keeps the step working if that ever changes.
      - name: Clippy with offline transcription
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null || brew install cmake
          cargo clippy -p note-everywhere-desktop --all-targets --features transcribe -- -D warnings
      - name: Test
        run: cargo test --workspace

  server:
    name: Sync server (wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings

  licenses:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

[package]
name = "note-everywhere-server"
description = "Note Everywhere sync server for Cloudflare Workers"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
worker = "0.9.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

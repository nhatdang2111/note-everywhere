[package]
name = "note-everywhere-server"
description = "Note Everywhere sync server for Cloudflare Workers"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ne-crypto = { version = "0.1.0", path = "../crates/ne-crypto", default-features = false }
ne-sync-protocol = { version = "0.1.0", path = "../crates/ne-sync/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
worker = "0.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

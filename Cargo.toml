[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The sync server compiles to WebAssembly for Cloudflare Workers and keeps its
# own lockfile and toolchain settings.
exclude = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

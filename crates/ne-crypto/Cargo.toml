[package]
name = "ne-crypto"
description = "Password key derivation, key wrapping and authenticated encryption."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["client"]
# Everything that needs OS randomness or heavy password hashing: key
# generation, sealing, streams, recovery keys and the account operations. The
# sync Worker builds with `default-features = false` and only gets `auth`.
client = [
    "dep:argon2",
    "dep:base64",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:hkdf",
    "dep:serde",
    "dep:zeroize",
]

[[example]]
name = "argon2_bench"
required-features = ["client"]

[dependencies]
argon2 = { version = "0.6.0", optional = true }
base64 = { version = "0.23.1", optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
getrandom = { version = "0.4.3", optional = true }
hkdf = { version = "0.13.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
sha2 = "0.11.0"
subtle = "2.6.1"
zeroize = { version = "1.9.2", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.154"

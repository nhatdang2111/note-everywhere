[package]
name = "ne-sync"
description = "Client for the end-to-end encrypted sync protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
getrandom = "0.4.3"
ne-crypto = { version = "0.1.0", path = "../ne-crypto" }
ne-sync-protocol = { version = "0.1.0", path = "protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
zeroize = "1.9.2"

[package]
name = "ne-store"
description = "Local SQLite storage, full-text search and the sync outbox."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ne-core = { version = "0.1.0", path = "../ne-core" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

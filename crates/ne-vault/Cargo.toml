[package]
name = "ne-vault"
description = "Secrets vault protected by a second password."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
loro = "1.18.0"
ne-crypto = { version = "0.1.0", path = "../ne-crypto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"

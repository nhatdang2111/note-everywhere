[package]
name = "ne-core"
description = "Block, page and workspace-tree model built on CRDT documents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
loro = "1.18.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

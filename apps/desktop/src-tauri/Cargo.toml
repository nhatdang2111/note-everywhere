[package]
name = "note-everywhere-desktop"
description = "Note Everywhere desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Windows requires (https://github.com/rust-lang/cargo/issues/8519).
name = "note_everywhere_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
ne-core = { path = "../../../crates/ne-core" }
ne-store = { path = "../../../crates/ne-store" }
ne-crypto = { path = "../../../crates/ne-crypto" }
ne-sync = { path = "../../../crates/ne-sync" }
ne-sync-protocol = { path = "../../../crates/ne-sync/protocol" }
ne-vault = { path = "../../../crates/ne-vault" }
ne-platform = { path = "../../../crates/ne-platform" }
ne-voice = { path = "../../../crates/ne-voice", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.8"
loro = "1.18.0"
thiserror = "2.0.21"
zeroize = "1.9.2"
uuid = { version = "1.29.3", features = ["v4"] }
tempfile = "3.27.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"

[features]
# Offline speech-to-text. Off by default: whisper.cpp needs cmake and libclang.
transcribe = ["dep:ne-voice", "ne-voice/transcribe"]
# GPU decoding for macOS release builds.
metal = ["transcribe", "ne-voice/metal"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1.54.1", features = ["test-util", "net", "io-util"] }

[package]
name = "note-everywhere-desktop"
description = "Note Everywhere desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Windows requires (https://github.com/rust-lang/cargo/issues/8519).
name = "note_everywhere_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
